# application.yml: хранит единственную настройку учебного приложения.
# Методов и формул нет; вход — конфигурация Spring Boot, выход — имя приложения.
# Зависимости — Spring Boot; побочный эффект — имя в контексте и журнале запуска.
# Диагностика — проверить стартовый журнал и LabControllerTest.applicationNameMatchesTicket.
# Тест и процедура изменения указаны в README.md; значение вступает в силу после перезапуска.
# application.yml: корневой раздел стандартных свойств Spring.
spring:
  # application.yml: свойства приложения сгруппированы под spring.application.
  application:
    # application.yml: точное значение номера студенческого билета как строки.
    name: "1БКС24106"
