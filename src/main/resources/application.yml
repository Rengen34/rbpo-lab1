# application.yml: задаёт имя приложения, локальный HTTP-адрес и строгий разбор JSON.
# Методов и формул нет; вход — конфигурация Spring Boot, выход — настройки контекста.
# Зависимости — Spring Boot и Jackson; побочные эффекты — адрес прослушивания и проверка полей.
# Диагностика — журнал запуска и HTTP-тесты; связь с настройками описана в README.md.
# Изменения вступают в силу после перезапуска; старое имя приложения сохранено без изменений.
# application.yml: корневой раздел стандартных свойств Spring.
spring:
  # application.yml: свойства приложения сгруппированы под spring.application.
  application:
    # application.yml: точное значение номера студенческого билета как строки.
    name: "1БКС24106"
  # application.yml: параметры библиотеки JSON сгруппированы под spring.jackson.
  jackson:
    # application.yml: неизвестные поля запросов считаются ошибкой вместо молчаливого пропуска.
    deserialization:
      # application.yml: серверные id и время нельзя передать как лишние поля входного DTO.
      fail-on-unknown-properties: true
      # application.yml: дробные JSON-числа сохраняются как точные BigDecimal до проверки цены.
      use-big-decimal-for-floats: true
# application.yml: сетевые настройки ограничивают доступ к учебным данным локальным компьютером.
server:
  # application.yml: HTTP-сервер слушает только loopback-интерфейс.
  address: 127.0.0.1
